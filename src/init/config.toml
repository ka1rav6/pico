# This is the default toml file created by the pico build system.
# remove any comment here to add that configuration to pico.

# Don't forget to name your version/file:
# TODO: make the name be that of the folder!!!
[project] # do not remove this table or else pico becomes wildd
# this is what your project will be named. This doesn't have to be the name of your executable that is created
# (if only one) but it will be by default.
name = ""   # by default this will be empty. 
# here is the version of your current build. It is just to track the version.
version = "0.0.0" # version can also be changed using TODO: pico config project.version="0.0.1"

# Currently pico only supports cpp, but it hopes to support c soon too! Till then, unfortunately, this is fixed.
language = "cpp" # or c++

# You can modify this as whatever version you want to use, but by default this is c++23
# TODO: have init call g++ (or clang++) version and replace it here. 
language_standard = "c++23"


# Compiler configurations
[compiler]
name = "g++" # g++ is the default but we also support clang++! Change it however you like!

# All the following are flags that you can add/enable for the compiler to work. 
optimization = "O2"
debug = true
warnings = "all"

# pico provides a better way to use flags.
# You don't have to know compiler flags always to use them properly.
# So, we provide you with some booleans you can just comment/uncomment whichever one you like

# or you can just use the following array and type every flag you need:
flags = [
    # "-pedantic",
    # "0fast"
]




