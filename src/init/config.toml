# Tests
[tests]
enabled = true
directory = "tests"

# Formatting
[format]
command = "clang-format"
style = "LLVM"

# Linting
[lint]
command = "clang-tidy"
checks = [
    "modernize-*",
    "performance-*",
    "bugprone-*"
]

