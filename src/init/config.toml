# Include directories
# if any other directories need to be used,
# drop down the path to them here! 
# pico will include them in your final executable!
includes = [
    "include",
    # "third_party/glfw/include", # some other examples
    # "third_party/glm",
    # "third_party/stb"
]


# Similarly, there are source directories
sources = [
    "src",
    # "src/rendering",
    # "src/core",
    # "src/math",
    # "src/util"
]

